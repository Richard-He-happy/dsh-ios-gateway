name: validate

on:
  push:
  pull_request:

jobs:
  manifests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check UTF-8 BOM and JSON validity
        run: node scripts/check-manifests.cjs
